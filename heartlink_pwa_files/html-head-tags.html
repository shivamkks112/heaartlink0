<!-- Service Worker Registration (Alternative inline method) -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js')
      .then(function(registration) {
        console.log('HeartLink SW registered with scope: ', registration.scope);
      }, function(err) {
        console.log('HeartLink SW registration failed: ', err);
      });
  });
}
</script>
