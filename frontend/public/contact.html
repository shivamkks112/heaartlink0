<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - HeartLink</title>
  <meta name="description" content="Get in touch with HeartLink support team. We're here to help.">
  <link rel="stylesheet" href="/static/css/landing.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <h1>HeartLink</h1>
      <nav>
        <a href="/">Home</a>
        <a href="/about.html">About</a>
        <a href="/auth">Login</a>
      </nav>
    </div>
  </header>

  <section class="hero-small">
    <h1>Contact Us</h1>
    <p>We'd love to hear from you</p>
  </section>

  <section class="content-section">
    <div class="container">
      <div class="contact-info">
        <h2>Get In Touch</h2>
        <p><strong>Email:</strong> support@heartlink.co.in</p>
        <p><strong>Response Time:</strong> Within 24 hours</p>
      </div>

      <div class="contact-form">
        <h2>Send Us a Message</h2>
        <form id="contactForm">
          <input type="text" placeholder="Your Name" required>
          <input type="email" placeholder="Your Email" required>
          <select required>
            <option value="">Select Topic</option>
            <option>Account Issue</option>
            <option>Technical Support</option>
            <option>Safety Concern</option>
            <option>Feature Request</option>
            <option>Other</option>
          </select>
          <textarea placeholder="Your Message" rows="5" required></textarea>
          <button type="submit" class="btn-primary">Send Message</button>
        </form>
      </div>
    </div>
  </section>

  <footer class="footer">
    <p>&copy; 2025 HeartLink. All rights reserved.</p>
  </footer>
</body>
</html>
