<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeartLink Feature Graphic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #000;
        }
        
        .feature-graphic {
            width: 1024px;
            height: 500px;
            position: relative;
            background: linear-gradient(135deg, #ec4899 0%, #f97316 100%);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1558715585-9b706788d173?w=1200&h=600&fit=crop');
            background-size: cover;
            background-position: center;
            opacity: 0.7;
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.7) 0%, rgba(249, 115, 22, 0.7) 100%);
        }
        
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px;
        }
        
        .logo {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #ec4899 0%, #f97316 100%);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            margin: 0 auto 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        
        .app-name {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 80px;
            font-weight: 900;
            color: white;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
            margin-bottom: 10px;
            letter-spacing: -2px;
        }
        
        .tagline {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 32px;
            font-weight: 600;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }
        
        .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50px;
            padding: 12px 30px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        
        .hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            z-index: 5;
        }
        
        .heart {
            position: absolute;
            font-size: 40px;
            opacity: 0.2;
            animation: float 6s infinite ease-in-out;
        }
        
        .heart:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; }
        .heart:nth-child(2) { left: 80%; top: 30%; animation-delay: 1s; }
        .heart:nth-child(3) { left: 20%; top: 70%; animation-delay: 2s; }
        .heart:nth-child(4) { left: 90%; top: 60%; animation-delay: 3s; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.1); }
        }
        
        .instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 10px;
            font-family: monospace;
            text-align: center;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="feature-graphic">
        <div class="background-image"></div>
        <div class="overlay"></div>
        
        <div class="hearts">
            <div class="heart">💕</div>
            <div class="heart">❤️</div>
            <div class="heart">💖</div>
            <div class="heart">💗</div>
        </div>
        
        <div class="content">
            <div class="logo">💕</div>
            <div class="app-name">HeartLink</div>
            <div class="tagline">India's Smartest Dating App</div>
            <div class="badge">✨ AI-Powered Matching</div>
        </div>
    </div>
    
    <div class="instructions">
        📸 Right click on graphic → "Save Image As" → Save as "feature-graphic.png"<br>
        Size: 1024 x 500 pixels | Ready for Play Store! ✅
    </div>
</body>
</html>
