name: Build HeartLink TWA (Android App)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli
    
    - name: Generate signing key
      run: |
        mkdir -p android-keys
        keytool -genkey -v -keystore android-keys/heartlink.keystore \
          -alias heartlink-key \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass heartlink2025 \
          -keypass heartlink2025 \
          -dname "CN=HeartLink, OU=Dating, O=HeartLink, L=Delhi, ST=Delhi, C=IN"
    
    - name: Initialize TWA
      run: bubblewrap init --manifest=twa-manifest.json
    
    - name: Build APK
      run: |
        cd heartlink-twa
        bubblewrap build
    
    - name: Upload Debug APK
      uses: actions/upload-artifact@v3
      with:
        name: heartlink-debug-apk
        path: heartlink-twa/app/build/outputs/apk/debug/app-debug.apk
    
    - name: Build Release APK
      run: |
        cd heartlink-twa
        bubblewrap build --release
    
    - name: Upload Release APK
      uses: actions/upload-artifact@v3
      with:
        name: heartlink-release-apk
        path: heartlink-twa/app/build/outputs/apk/release/app-release.apk
    
    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: HeartLink Android v1.0.${{ github.run_number }}
        files: |
          heartlink-twa/app/build/outputs/apk/release/app-release.apk
          heartlink-twa/app/build/outputs/bundle/release/app-release.aab
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
